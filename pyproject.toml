[project]
name = "ai-monopoly-deal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
rollout = "rollout.rollout:main"
serve = "api.main:main"
typecheck = "pyright.cli:entrypoint"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["models*", "rollout*", "mcts*", "serialization*", "api*"]
exclude = ["*.tests", "*.tests.*"]

[dependency-groups]
dev = [
    "pyright>=1.1.410",
    "torch>=2.12.1",
]
