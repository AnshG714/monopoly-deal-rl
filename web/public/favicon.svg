<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>Monopoly Deal</title>
  <defs>
    <linearGradient id="bg" x1="8" y1="6" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="card" x1="18" y1="10" x2="45" y2="53" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="stripe" x1="20" y1="14" x2="45" y2="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ec4899"/>
      <stop offset="0.52" stop-color="#f97316"/>
      <stop offset="1" stop-color="#facc15"/>
    </linearGradient>
    <linearGradient id="aura" x1="14" y1="11" x2="51" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#bbf7d0"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="shadow" x="8" y="6" width="48" height="54" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <path d="M12 45c7 8 25 11 39 0" fill="none" stroke="url(#aura)" stroke-width="2.8" stroke-linecap="round" opacity="0.9"/>
  <g filter="url(#shadow)">
    <rect x="14.5" y="16.5" width="31" height="39" rx="5" fill="#93c5fd" opacity="0.82" transform="rotate(-10 30 36)"/>
    <rect x="20.5" y="11.5" width="31" height="39" rx="5" fill="#fda4af" opacity="0.82" transform="rotate(8 36 31)"/>
    <rect x="17.5" y="10.5" width="31" height="43" rx="5.5" fill="url(#card)" stroke="#0f172a" stroke-width="2"/>
    <rect x="21" y="15" width="24" height="8" rx="1.8" fill="url(#stripe)"/>
    <rect x="21" y="26" width="24" height="2.2" rx="1.1" fill="#0f172a" opacity="0.18"/>
    <rect x="21" y="31" width="24" height="2.2" rx="1.1" fill="#0f172a" opacity="0.14"/>
    <path d="M23.5 47.2 32.5 49.3 42.2 46.1" fill="none" stroke="#0f172a" stroke-width="1.6" stroke-linecap="round" opacity="0.72"/>
    <circle cx="23.5" cy="47.2" r="2.6" fill="#22c55e" stroke="#0f172a" stroke-width="1"/>
    <circle cx="32.5" cy="49.3" r="2.6" fill="#06b6d4" stroke="#0f172a" stroke-width="1"/>
    <circle cx="42.2" cy="46.1" r="2.6" fill="#a3e635" stroke="#0f172a" stroke-width="1"/>
